services:
  db:
    image: postgres:15
    container_name: ia369_db
    environment:
      POSTGRES_DB: ia369_factoring
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
    ports:
      - "5369:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USER} -d ia369_factoring" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ia369_backend
    environment:
      # Overrides application.yml's localhost:5369 URL (Spring env vars win
      # over yml values) so the backend talks to the db container over the
      # internal docker network instead of the host-published port.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ia369_factoring
      DB_POSTGRES_USER: ${DB_POSTGRES_USER}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
    ports:
      - "8369:8369"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_LOGIN_USR: ${VITE_LOGIN_USR}
        VITE_LOGIN_PWD: ${VITE_LOGIN_PWD}
    container_name: ia369_frontend
    ports:
      # Host 3000 is already taken by another app (qr369-frontend) on the
      # shared OCI instance's default nginx vhost — 3369 keeps the project's
      # own "369" port convention (5369 db, 8369 backend) and stays free.
      - "3369:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
