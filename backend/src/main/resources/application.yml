spring:
  application:
    name: factoring-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ia369_factoring
    username: ${DB_POSTGRES_USER}
    password: ${DB_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8090
