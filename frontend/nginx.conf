server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-style fallback (App.jsx swaps screens client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container over the internal docker network.
    # Keeps the whole system reachable through a single public port.
    location /api/ {
        proxy_pass http://backend:8369/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
